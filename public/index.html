<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a10"><title>Nightshift — заказ</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand">NIGHT<span>SHIFT</span></div><div class="badge">● Смена открыта</div></header>
    <p class="hello" id="greeting">Добрый вечер</p><h1 class="title">Новый заказ</h1>
    <label class="table-label" for="table">НОМЕР СТОЛА</label><select class="table-select" id="table"><option value="">Выберите стол</option></select>
    <nav class="tabs" id="tabs" aria-label="Категории"></nav>
    <section><div class="section-head"><h2 id="category-title">Меню</h2><small id="item-count"></small></div><div class="products" id="products"></div></section>
    <div id="notice" class="notice hidden"></div>
  </main>
  <div class="footer"><div class="footer-inner"><button class="submit" id="submit" disabled><span>Оформить заказ</span><span class="sum" id="total">0 ₽</span></button></div></div>
  <div class="toast hidden" id="toast"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body></html>
